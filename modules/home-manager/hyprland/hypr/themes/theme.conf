source = colors.conf

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    col.active_border = $primary_fixed_dim
    col.inactive_border = $outline_variant

    layout = dwindle
    resize_on_border = true
}

group {
  col.border_active = $tertiary
  col.border_inactive = $outline_variant

  col.border_locked_active = $error 
  col.border_locked_inactive = $error

  groupbar {
    col.active = $tertiary
    col.inactive = $outline_variant
    col.locked_active = $error
    col.locked_inactive = $outline_variant

    text_color = $on_tertiary
    text_color_inactive = $on_surface
    text_color_locked_active = $on_error
    text_color_locked_inactive = $on_surface
    font_size = 10
    font_family = Roboto
    font_weight_active = bold
    font_weight_inactive = bold

    gradients = true
    gradient_rounding = 6
    indicator_height = 0
  }
}

decoration {
    rounding = 16
 
    blur {
        enabled = yes
        passes = 2
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}
